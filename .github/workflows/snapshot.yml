name: Snapshot FPL data

# The API only serves the current state, so capture it daily and keep the
# history on a dedicated `data` branch. Keeping it off `main` means these
# commits never trigger a redeploy of the app.
on:
  schedule:
    # Twice daily, and the second run is the important one.
    #
    # 06:00 UTC captures the day's state after the overnight price changes.
    # This is the run that writes the append-only daily file, which is the
    # only record that will ever exist of injury status and set-piece duty.
    - cron: "0 6 * * *"
    #
    # 11:30 UTC captures the state closest to the deadline. Measured across
    # 2026-27, the earliest deadline is 12:30 UTC and 29 of 38 fall between
    # 12:00 and 14:00 — so the 06:00 run alone is 6.5 hours stale by the time
    # a gameweek locks, and the hours before a deadline are exactly when team
    # news lands. This run overwrites the gameweek snapshot and leaves the
    # daily file alone, which is what write_daily_signals already enforces.
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out the data branch into ./snapshots
        run: |
          git fetch origin data --depth=1 || echo "no data branch yet"
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add snapshots origin/data
          else
            git worktree add --detach snapshots
            cd snapshots
            git checkout --orphan data
            git rm -rf --quiet . || true
          fi

      - name: Capture the snapshot
        run: python scripts/snapshot.py --root snapshots

      - name: Report what is held
        working-directory: snapshots
        run: |
          echo "daily captures: $(ls daily 2>/dev/null | wc -l)"
          du -sh . 2>/dev/null || true

      - name: Commit if anything changed
        working-directory: snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no change since the last snapshot"
          else
            git commit -m "Snapshot FPL data $(date -u +%Y-%m-%d)"
            git push origin HEAD:data
          fi
